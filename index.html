<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXION | UNIVERSAL COMMAND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luxBlack: '#050505',
                        luxGold: '#D4AF37',
                        luxSlate: '#1A1A1A',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&family=JetBrains+Mono:wght@300&display=swap');
        
        :root { --sat: env(safe-area-inset-top); }
        body { 
            background: #050505; color: #D1D5DB; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
            height: 100dvh; /* Dynamic viewport height para iOS */
        }

        .luxury-glass {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* Safari support */
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #canvas-container { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; }
        
        /* Custom Scrollbar for Terminal */
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col">
    <div id="canvas-container"></div>

    <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-8">
        <div class="flex items-center gap-4 w-full md:w-auto">
            <div class="h-8 w-[2px] bg-luxGold shadow-[0_0_10px_#D4AF37]"></div>
            <div>
                <h1 class="text-xl md:text-2xl font-black tracking-tighter text-white uppercase">AXION <span class="gold-gradient italic">CORE</span></h1>
                <p class="text-[8px] tracking-[0.4em] text-luxGold opacity-60 uppercase">Global Node: Active</p>
            </div>
        </div>
        
        <nav class="flex gap-3 w-full md:w-auto justify-center">
            <a href="Sistemas.html" class="luxury-glass px-5 py-2.5 rounded-full text-[10px] font-bold tracking-widest text-white flex items-center gap-2 flex-1 md:flex-none justify-center border border-luxGold/20">
                <i data-lucide="layers" class="w-4 h-4 text-luxGold"></i> SISTEMAS
            </a>
            <button class="luxury-glass px-5 py-2.5 rounded-full text-[10px] font-bold tracking-widest text-luxGold flex items-center gap-2 flex-1 md:flex-none justify-center">
                <i data-lucide="shield" class="w-4 h-4"></i> SECURE
            </button>
        </nav>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-6 flex-1 overflow-y-auto md:overflow-visible">
        
        <div class="md:col-span-3 space-y-4 order-2 md:order-1">
            <div class="luxury-glass p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] text-luxGold uppercase tracking-widest">Neural Stream</span>
                    <div class="w-2 h-2 rounded-full bg-luxGold animate-pulse"></div>
                </div>
                <canvas id="mobileChart" height="150"></canvas>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-1 gap-4">
                <div class="luxury-glass p-4 rounded-2xl flex flex-col justify-center border-l-2 border-luxGold">
                    <span class="text-[9px] text-gray-500 uppercase">Latency</span>
                    <span class="text-xl font-bold text-white tracking-tighter">0.002<span class="text-luxGold text-xs">ms</span></span>
                </div>
                <div class="luxury-glass p-4 rounded-2xl flex flex-col justify-center border-l-2 border-luxGold">
                    <span class="text-[9px] text-gray-500 uppercase">Uptime</span>
                    <span class="text-xl font-bold text-white tracking-tighter">99.9<span class="text-luxGold text-xs">%</span></span>
                </div>
            </div>
        </div>

        <div class="md:col-span-6 h-[300px] md:h-auto order-1 md:order-2 luxury-glass rounded-3xl p-1 overflow-hidden">
            <div class="h-full w-full bg-luxBlack/60 rounded-[1.4rem] p-5 flex flex-col font-mono">
                <div id="term" class="flex-1 overflow-y-auto text-[11px] space-y-2 text-gray-400 terminal-scroll">
                    <p class="text-luxGold opacity-50 text-[9px] underline uppercase tracking-widest mb-2 font-sans">-- Terminal initialized --</p>
                    <p>> Omnimind-X Ready.</p>
                    <p>> Protocol 2045.c Mobile-Optimized: <span class="text-white">ACTIVE</span>.</p>
                </div>
                <div class="mt-4 flex items-center gap-2 border-t border-white/5 pt-4">
                    <i data-lucide="chevron-right" class="w-4 h-4 text-luxGold"></i>
                    <input type="text" id="in" class="bg-transparent outline-none w-full text-white text-xs" placeholder="Escribir comando..." autocomplete="off">
                </div>
            </div>
        </div>

        <div class="md:col-span-3 space-y-4 order-3">
            <div class="luxury-glass p-6 rounded-3xl flex flex-col items-center text-center relative overflow-hidden group">
                <div class="absolute inset-0 bg-luxGold/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="w-16 h-16 rounded-full border border-luxGold/20 flex items-center justify-center mb-3">
                    <i data-lucide="cpu" class="w-6 h-6 text-luxGold animate-pulse"></i>
                </div>
                <h4 class="text-[10px] font-bold tracking-[0.3em] uppercase text-gray-400">Core Status</h4>
                <p class="text-3xl font-light text-white tracking-tighter">ULTRA</p>
            </div>
            
            <button class="w-full luxury-glass py-4 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] text-luxGold hover:bg-luxGold hover:text-luxBlack transition-all">
                Re-Sync Nodes
            </button>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // MOTOR 3D ADAPTATIVO
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limita resolución en móviles 4K para rendimiento
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const gridGeo = new THREE.SphereGeometry(15, 32, 32);
        const gridMat = new THREE.MeshBasicMaterial({ color: 0xD4AF37, wireframe: true, transparent: true, opacity: 0.08 });
        const grid = new THREE.Mesh(gridGeo, gridMat);
        scene.add(grid);
        camera.position.z = 25;

        function animate() {
            requestAnimationFrame(animate);
            grid.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // CHART OPTIMIZATION
        const ctx = document.getElementById('mobileChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(15).fill(''),
                datasets: [{
                    data: Array(15).fill(0).map(() => Math.random() * 50 + 20),
                    borderColor: '#D4AF37',
                    borderWidth: 1.5,
                    tension: 0.4,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: 'rgba(212, 175, 55, 0.05)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // TERMINAL INPUT HANDLING
        const input = document.getElementById('in');
        const output = document.getElementById('term');
        input.addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && input.value.trim() !== "") {
                const p = document.createElement('p');
                p.innerHTML = `<span class="text-luxGold font-bold">></span> ${input.value}`;
                output.appendChild(p);
                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        });

        // RESIZE HANDLER
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
