<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXION | LUXURY COMMAND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luxBlack: '#050505',
                        luxGold: '#D4AF37',
                        luxSlate: '#1A1A1A',
                        luxAzure: '#007AFF',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&family=JetBrains+Mono:wght@300&display=swap');
        body { background: #050505; color: #D1D5DB; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .luxury-glass {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .luxury-glass:hover { border-color: rgba(212, 175, 55, 0.5); box-shadow: 0 0 30px rgba(212, 175, 55, 0.1); }
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #canvas-container { position: fixed; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col">
    <div id="canvas-container"></div>

    <header class="flex justify-between items-center mb-10">
        <div class="flex items-center gap-6">
            <div class="h-10 w-[2px] bg-luxGold shadow-[0_0_15px_#D4AF37]"></div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter text-white">AXION <span class="gold-gradient">OS</span></h1>
                <p class="text-[9px] tracking-[0.5em] text-luxGold uppercase opacity-70">The Singularity Engine v.2045</p>
            </div>
        </div>
        <nav class="flex gap-8">
            <a href="Sistemas.html" class="luxury-glass px-8 py-3 rounded-full text-[10px] font-bold tracking-widest hover:text-white flex items-center gap-2">
                <i data-lucide="layers" class="w-4 h-4 text-luxGold"></i> SISTEMAS_RED
            </a>
            <button class="luxury-glass px-8 py-3 rounded-full text-[10px] font-bold tracking-widest text-luxGold flex items-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4"></i> SECURE_LINK
            </button>
        </nav>
    </header>

    <main class="grid grid-cols-12 gap-8 flex-1">
        <div class="col-span-3 space-y-6">
            <div class="luxury-glass p-6 rounded-2xl">
                <h3 class="text-[10px] uppercase tracking-widest text-luxGold mb-6 flex justify-between">
                    Neural Load <span class="text-white">Active</span>
                </h3>
                <canvas id="luxuryChart" height="250"></canvas>
            </div>
            <div class="luxury-glass p-6 rounded-2xl border-l-4 border-luxGold">
                <p class="text-[10px] text-gray-500 uppercase mb-2">Omnimind Response</p>
                <div class="text-2xl font-light text-white italic">"Optimización al <span class="text-luxGold">99.9%</span>"</div>
            </div>
        </div>

        <div class="col-span-6 luxury-glass rounded-3xl p-1 relative overflow-hidden">
            <div class="h-full w-full bg-luxBlack/40 rounded-[1.4rem] p-6 flex flex-col font-mono">
                <div class="flex items-center gap-2 mb-4 text-[10px] text-luxGold opacity-50">
                    <i data-lucide="command" class="w-3 h-3"></i> ROOT_ACCESS_GRANTED
                </div>
                <div id="term" class="flex-1 overflow-y-auto text-xs space-y-2 text-gray-300 custom-scrollbar">
                    <p class="text-luxGold">[SYS] OMNIMIND-X inicializado...</p>
                    <p>[SYS] Simulación de 50 capas completa.</p>
                </div>
                <div class="mt-4 flex items-center gap-3 border-t border-white/5 pt-4">
                    <span class="text-luxGold">>></span>
                    <input type="text" id="in" class="bg-transparent outline-none w-full text-white" placeholder="Ejecutar comando maestro...">
                </div>
            </div>
        </div>

        <div class="col-span-3 space-y-6">
            <div class="luxury-glass p-8 rounded-3xl flex flex-col items-center text-center">
                <div class="w-20 h-20 rounded-full border border-luxGold/30 flex items-center justify-center mb-4 relative">
                    <div class="absolute inset-0 rounded-full border-t-2 border-luxGold animate-spin"></div>
                    <i data-lucide="cpu" class="w-8 h-8 text-luxGold"></i>
                </div>
                <h4 class="text-xs font-bold tracking-widest uppercase">Global Core</h4>
                <div class="text-4xl font-black mt-2">14.2<span class="text-luxGold text-xl">ms</span></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="luxury-glass p-4 rounded-2xl text-center">
                    <p class="text-[9px] uppercase text-gray-500">Nodes</p>
                    <p class="text-xl font-bold">10k</p>
                </div>
                <div class="luxury-glass p-4 rounded-2xl text-center">
                    <p class="text-[9px] uppercase text-gray-500">Security</p>
                    <p class="text-xl font-bold text-luxGold">MAX</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // 3D Background - Golden Neural Grid
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(10, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0xD4AF37, wireframe: true, transparent: true, opacity: 0.05 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        camera.position.z = 20;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.001;
            sphere.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        // Chart refinement
        const ctx = document.getElementById('luxuryChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(10).fill(''),
                datasets: [{
                    data: [10, 25, 15, 35, 20, 45, 30, 55, 40, 60],
                    borderColor: '#D4AF37',
                    borderWidth: 1,
                    tension: 0.5,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: 'rgba(212, 175, 55, 0.02)'
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
        });

        // Terminal logic
        const input = document.getElementById('in');
        const output = document.getElementById('term');
        input.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const p = document.createElement('p');
                p.innerHTML = `<span class="text-luxGold">></span> ${input.value}`;
                output.appendChild(p);
                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        });
    </script>
</body>
</html>
